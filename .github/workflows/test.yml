name: Unit tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (100% coverage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . "django>=4.2" pytest pytest-cov
      - name: Run unit tests with coverage gate
        run: python -m pytest tests/unit --cov=h5pxblock --cov-branch --cov-report=term-missing --cov-fail-under=100
